baseURL: https://example.com/
title: Stacknote Demo
theme: stacknote
locale: en-US
enableRobotsTXT: true

pagination:
  pagerSize: 6

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS, JSON]

params:
  author: Example Author
  authorInitials: EA
  role: Software Engineer
  tagline: Field-tested engineering notes
  description: A demonstration site for the Stacknote Hugo theme.
  homeEyebrow: FIELD NOTES · ENGINEERING
  homeTitle: Notes from building real systems
  homeIntro: Practical lessons, trade-offs, and reproducible technical work.
  aboutIntro: I write about systems that have survived contact with production.
  mainSection: articles
  authorPage: /about/
  showToc: true
  showTopics: true
  showAbout: true
  showNewsletter: true
  minTagPostsToIndex: 2
  themeColor: "#FAFAF7"
  defaultSocialImage: images/social-card.png

menu:
  main:
    - name: Archive
      url: /archives/
      weight: 10
    - name: Search
      url: /search/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: About
      url: /about/
      weight: 40

related:
  includeNewer: true
  threshold: 40
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10
