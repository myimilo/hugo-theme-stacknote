{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="section__head">
      <h1 class="section__title">{{ .Title }}</h1>
    </div>
    <div class="list-grid">
      {{ range .Paginator.Pages }}
      {{ partial "post-card.html" (dict "page" . "variant" "list") }}
      {{ else }}<div class="empty-state">{{ i18n "noArticles" }}</div>
      {{ end }}
    </div>
    {{ template "_internal/pagination.html" . }}
  </div>
</section>
{{ end }}
